<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Proyecto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#F1F5F9;color:#0F172A}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(15,23,42,.12);padding:16px;margin:12px 0}
h2,h3{margin:.2em 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:#1E88E5;cursor:pointer;margin:8px 0;text-align:center;text-decoration:none}
.btn.green{background:#16A34A}.btn.wa{background:#25D366}.btn.orange{background:#F97316}
.tag{padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;background:#DBEAFE;color:#2563EB}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #e2e8f0;padding:6px 4px;text-align:left}
label{font-size:13px;color:#475569}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;margin:4px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
</style></head><body><div class="wrap">
<div id="head" class="card" style="text-align:center"></div>
<div id="proy" class="card"></div>
<div id="estado" class="card"></div>
<div id="cotiz" class="card"></div>
<div id="poliza" class="card"></div>
<div id="cat" class="card"></div>
<div id="contacto" class="card"></div>
</div><script>
var SB=supabase.createClient('https://faxajvtlbyazkmgtkjwe.supabase.co','sb_publishable_qRgmRIBfIl7kjBDQk7iBnQ_JwVuQCfr');
var token=new URLSearchParams(location.search).get('token');
if(!token){document.getElementById('proy').innerHTML='<p>Enlace no válido.</p>';}
else SB.from('shares').select('*').eq('token',token).maybeSingle().then(function(r){
 if(!r.data){document.getElementById('proy').innerHTML='<p>Enlace no encontrado.</p>';return;}
 var D=r.data.data,T=D.taller;window._tok=token;window._tel=D.whatsapp||'';window._tnom=T.nombre||'';
 document.title=(T.nombre||'AlumiPro');
 document.getElementById('head').innerHTML=(T.logo?'<img src="'+T.logo+'" style="max-height:70px">':'')+'<h2>'+(T.nombre||'')+'</h2><small>'+(T.tagline||'')+'</small>';
 if(D.cot){var c=D.cot;
  document.getElementById('proy').innerHTML='<h3>Proyecto #'+c.id+' · '+c.cliente+'</h3><span class="tag">'+c.estado+'</span>'+
   '<table><tr><th>Elemento</th><th>Medida</th><th>Estatus</th></tr>'+c.items.map(function(i){return '<tr><td>'+i.n+'</td><td>'+i.med+'</td><td>'+i.est+'</td></tr>';}).join('')+'</table>'+
   '<p>Avance de corte: <b>'+(D.avance.corte||'—')+'</b> · Orden: '+(D.avance.orden||'—')+'</p>'+
   (D.avance.instalacion?'<p>📅 Instalación: '+new Date(D.avance.instalacion).toLocaleDateString('es-MX')+'</p>':'');
  document.getElementById('estado').innerHTML='<h3>💰 Estado de cuenta</h3><p>Total: <b>$'+c.total.toFixed(2)+'</b> · Pagado: <b style="color:#16A34A">$'+c.pagado.toFixed(2)+'</b> · Saldo: <b style="color:#DC2626">$'+c.saldo.toFixed(2)+'</b></p>'+
   '<button class="btn green" onclick="confAnticipo()">✅ Confirmar anticipo</button>'+
   '<button class="btn orange" onclick="solicitarPago()">💳 Solicitar link de pago</button>';
 }else{
  document.getElementById('proy').innerHTML='<p style="color:#64748B">Bienvenido. Solicita tu cotización o contrata una póliza.</p>';
  document.getElementById('estado').style.display='none';}
 document.getElementById('cotiz').innerHTML='<h3>🪟 Solicitar cotización</h3>'+
  '<div class="row"><div><label>Tipo</label><select id="qTip"><option>Corrediza</option><option>Fija</option><option>Puerta</option><option>Proyectable</option><option>Guillotina</option></select></div>'+
  '<div><label>Acabado</label><select id="qCol"><option>Natural</option><option>Blanco</option><option>Negro</option><option>Bronce</option></select></div></div>'+
  '<div class="row"><div><label>Ancho (mm)</label><input id="qW" type="number" value="1800"></div><div><label>Alto (mm)</label><input id="qH" type="number" value="1200"></div></div>'+
  '<label>Nombre / contacto</label><input id="qNom" placeholder="Tu nombre y teléfono">'+
  '<label>Notas</label><textarea id="qNotas" rows="2"></textarea>'+
  '<button class="btn" onclick="solicitarCot()">Enviar solicitud</button>';
 document.getElementById('poliza').innerHTML='<h3>🛡 Póliza de mantenimiento</h3>'+
  '<label>Plan</label><select id="pPlan"><option>Básica (1 visita/año)</option><option>Plus (2 visitas/año)</option></select>'+
  '<button class="btn" onclick="contratarPoliza()">Contratar póliza</button>';
 document.getElementById('cat').innerHTML='<h3>🗂 Catálogo</h3>'+(D.catalog||[]).map(function(x){return '<div style="padding:6px 0;border-bottom:1px solid #e2e8f0">'+x.n+'</div>';}).join('');
 var tel=D.whatsapp||'';
 document.getElementById('contacto').innerHTML='<h3>📞 Contacto</h3><a class="btn wa" target="_blank" href="https://wa.me/52'+tel.replace(/\D/g,'')+'?text='+encodeURIComponent('Hola '+T.nombre+', quiero información')+'">Escribir por WhatsApp</a>';});
function ev(tipo,monto,msg){SB.from('client_events').insert({token:window._tok,tipo:tipo,monto:monto||null,msg:msg||null}).then(function(){alert('✔ Enviado al taller. Te contactaremos pronto.');});}
function confAnticipo(){var m=prompt('Monto del anticipo a confirmar:');if(!m)return;ev('confirmar_anticipo',+m);}
function solicitarPago(){var m=prompt('Monto para el link de pago:');if(!m)return;ev('solicitar_link_pago',+m);}
function solicitarCot(){ev('solicitar_cotizacion',null,(qNom.value?qNom.value+' · ':'')+qTip.value+' '+qW.value+'x'+qH.value+'mm '+qCol.value+(qNotas.value?' · '+qNotas.value:''));}
function contratarPoliza(){ev('solicitar_poliza',null,(qNom.value?qNom.value+' · ':'')+pPlan.value);}
</script></body></html>
